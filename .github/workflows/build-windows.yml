name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main, master, v2-development]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows standalone EXE
        shell: pwsh
        run: |
          dotnet publish ./YiErBuBu.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o ./out
          if (!(Test-Path ./out/YiErBuBu.exe)) { throw 'EXE not found' }
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: YiErBuBu-V2.1-Windows-x64
          path: out/
          if-no-files-found: error
